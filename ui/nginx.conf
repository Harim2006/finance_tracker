server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s;
    set $budget_upstream http://budget:5001;
    set $bills_upstream http://bills:5002;

    location /api/budget/ {
        rewrite ^/api/budget/(.*)$ /$1 break;
        proxy_pass $budget_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/bills/ {
        rewrite ^/api/bills/(.*)$ /$1 break;
        proxy_pass $bills_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
